<svg width="760" height="256" viewBox="0 0 760 256" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#757575"/></marker></defs>
<rect width="760" height="256" rx="6" fill="#F9F9F7"/>


<text x="380" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1E1E1E">A pull request with all three agents on</text>


<text x="73" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">You</text>
<text x="378" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">Claude Ship</text>
<text x="685" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">You and GitHub</text>


<rect x="152" y="80" width="452" height="156" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>


<rect x="18" y="119" width="110" height="56" rx="4" fill="#E8E8E4"/>
<text x="73" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1E1E1E">Pull request</text>
<text x="73" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#757575">opened or updated</text>


<text x="230" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">Review</text>
<rect x="168" y="119" width="124" height="56" rx="4" fill="#EDE8F4"/>
<text x="230" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1E1E1E">Code Review</text>
<text x="230" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#757575">finds problems</text>


<text x="378" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">Fix</text>
