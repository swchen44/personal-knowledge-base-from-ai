<path d="M292 147 L326 147" stroke="#757575" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M456 147 L476 147" stroke="#757575" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M598 147 L632 147" stroke="#757575" stroke-width="1.5" marker-end="url(#a)"/>
